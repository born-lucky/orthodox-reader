<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reader</title>
<link rel="icon" id="favicon">
<style>
/* ----------------------------------------------------------------------------
   NeXTSTEP. The 2-bit palette (black, dark grey, light grey, white), Helvetica,
   1-pixel bevels lit from the top left, a black title bar, etched boxes, button
   matrices, and white for what is chosen. Nothing else.
   ---------------------------------------------------------------------------- */
:root {
  --black: #000; --dark: #555; --light: #aaa; --white: #fff;
  --face: var(--light);
  --well: var(--white);
  --ink: var(--black); --muted: #333;
  --hi: var(--white); --lo: var(--black); --lo2: var(--dark);
  --chosen: var(--white);
  --title: var(--black); --title-ink: var(--white);
  color-scheme: light;
}
:root[data-theme="dark"] {        /* the same machine with the lights down */
  --face: #2b2b2b; --well: #141414; --ink: #f0f0f0; --muted: #a8a8a8;
  --hi: #5c5c5c; --lo: #000; --lo2: #141414; --chosen: #6a6a6a;
  --title: #000; --title-ink: #f0f0f0;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--face); color: var(--ink); font: 13px/1.4 "Helvetica Neue", Helvetica, Arial, sans-serif; }
::selection { background: var(--dark); color: var(--white); }
button, .seg, .check, .step, .cell, .wd, .calhead, .icon, .titlebar { user-select: none; }

::-webkit-scrollbar { width: 18px; background: var(--dark); }
::-webkit-scrollbar-thumb { background: var(--face); border: 1px solid; border-color: var(--hi) var(--lo) var(--lo) var(--hi);
                            box-shadow: inset -1px -1px 0 var(--lo2); }

.titlebar { position: sticky; top: 0; z-index: 5; height: 23px; background: var(--title); color: var(--title-ink);
            display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 13px; }

main { max-width: 520px; margin: 0 auto; padding: 14px 16px 24px; }

.bevel, button.b { background: var(--face); color: var(--ink); border: 1px solid; border-color: var(--hi) var(--lo) var(--lo) var(--hi);
                   box-shadow: inset -1px -1px 0 var(--lo2); }
button { font: inherit; cursor: pointer; }
button.b { padding: 4px 12px; min-height: 24px; }
button.b:active, button.b.on { background: var(--chosen); border-color: var(--lo) var(--hi) var(--hi) var(--lo); box-shadow: inset 1px 1px 0 var(--lo2); }
button.b:focus-visible { outline: 1px dotted var(--ink); outline-offset: -4px; }
button.b.default { font-weight: 700; }
.well { background: var(--well); border: 1px solid; border-color: var(--lo2) var(--hi) var(--hi) var(--lo2); box-shadow: inset 1px 1px 0 var(--lo); }

fieldset.box { border: 1px solid var(--lo2); box-shadow: 1px 1px 0 var(--hi), inset 1px 1px 0 var(--hi); margin: 14px 0 0; padding: 10px 12px 12px; }
fieldset.box > legend { padding: 0 4px; font-weight: 700; }

.head { display: grid; grid-template-columns: 112px 1fr; gap: 14px; align-items: center; }
.icon { width: 112px; height: 142px; padding: 3px; }
.icon img { width: 100%; height: 100%; object-fit: cover; display: block; }
h1 { font-size: 22px; font-weight: 700; margin: 0 0 4px; }
.date { color: var(--muted); }
.feast { font-weight: 700; margin-top: 6px; }
.fast { margin-top: 4px; }

.row { display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 28px; }
.row + .row, .stack + .row, .stack + .stack { margin-top: 8px; }
.stack > .label { display: block; margin-bottom: 4px; }
.sub { color: var(--muted); font-size: 12px; }
.status .big { font-size: 15px; font-weight: 700; }
.bar { height: 10px; margin-top: 6px; padding: 1px; }
.bar i { display: block; height: 100%; width: 0; background: var(--dark); }
.actions { display: grid; grid-template-columns: 1fr 1fr 1.3fr; gap: 6px; margin-top: 12px; }
.stop { display: none; width: 100%; margin-top: 12px; }
.reading .actions { display: none; }
.reading .stop { display: block; }

.seg { display: flex; }
.seg button { flex: 1; padding: 3px 6px; min-height: 24px; white-space: nowrap; }
.seg button + button { margin-left: -1px; }

.check { width: 16px; height: 16px; flex: none; cursor: pointer; display: grid; place-items: center; font-size: 13px; line-height: 1; font-weight: 700; }
.check.on::after { content: "✓"; }
label.l { flex: 1; cursor: pointer; }

.step { display: inline-flex; align-items: center; gap: 4px; flex: none; }
.step button { width: 22px; height: 22px; padding: 0; font-size: 9px; }
.step output { min-width: 70px; text-align: center; padding: 2px 6px; font-variant-numeric: tabular-nums; }
.step.wide output { min-width: 180px; }

.calhead { display: flex; align-items: center; gap: 6px; margin-bottom: 8px; }
.calhead span { flex: 1; text-align: center; font-weight: 700; font-size: 14px; }
.calhead button.arrow { width: 24px; height: 22px; padding: 0; font-size: 9px; }
.grid { display: grid; grid-template-columns: repeat(7, 1fr); padding: 2px; }
.wd { text-align: center; font-size: 11px; color: var(--muted); padding: 3px 0; }
.cell { height: 42px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; cursor: pointer;
        position: relative; border: 1px solid transparent; }
.cell b { font-weight: 400; font-variant-numeric: tabular-nums; }
.cell small { font-size: 9px; color: var(--muted); line-height: 1; }
.cell.today b { font-weight: 700; text-decoration: underline; }
.cell.great b { font-weight: 700; }
.cell .mk { position: absolute; top: 2px; right: 4px; font-size: 9px; }
.cell.sel { background: var(--face); border-color: var(--lo) var(--hi) var(--hi) var(--lo); box-shadow: inset 1px 1px 0 var(--lo2); }
.dot { width: 6px; height: 6px; border-radius: 50%; display: inline-block; }
.dot.strict { background: var(--ink); }
.dot.relaxed { border: 1px solid var(--ink); }
.legend { display: flex; gap: 14px; justify-content: center; font-size: 11px; color: var(--muted); padding: 8px 0 0; }
.legend span { display: inline-flex; align-items: center; gap: 4px; }
.detail { margin-top: 10px; padding: 10px; }
.detail .when { color: var(--muted); font-size: 12px; }
.detail .title { font-weight: 700; font-size: 14px; margin: 2px 0 6px; }
.detail ul { margin: 6px 0 0; padding-left: 18px; }
.detail .refs { margin-top: 6px; }
.detail .read { margin-top: 10px; }
.onlabel { color: var(--muted); font-size: 12px; margin-left: auto; cursor: pointer; }
/* what is ahead: kind, name, date, and how many days */
.arow:empty { display: none; }
.arow { display: grid; grid-template-columns: 92px 1fr auto; gap: 10px; align-items: center; }
.arow + .arow { margin-top: 6px; }
.arow .kind { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; }
.arow .name { font-weight: 700; }
.arow .name small { display: block; font-weight: 400; color: var(--muted); font-size: 11px; }
.arow .days { padding: 2px 8px; text-align: center; min-width: 64px; font-variant-numeric: tabular-nums; }
/* the cog */
.head { position: relative; }
.corner { position: absolute; top: 0; right: 0; display: flex; gap: 6px; }
.cog { width: 28px; height: 28px; padding: 0; font-size: 16px; line-height: 1; }
.corner .b { min-height: 28px; }
/* reading: the text itself, to read with your own eyes */
.text { padding: 14px 16px; margin-top: 12px; font-size: 15px; line-height: 1.65; }
.text p { margin: 0 0 8px; }
.text sup { color: var(--muted); font-size: 10px; margin-right: 3px; }
.text .here { background: var(--face); outline: 1px solid var(--lo2); }
.text h3 { margin: 0 0 10px; font-size: 16px; }
.next { margin-top: 8px; color: var(--muted); }
select.b { padding: 3px 6px; min-height: 26px; flex: 1; font: inherit; }
.reading .show { display: inline-block; }
.show { display: none; }
.stoprow { display: none; gap: 6px; margin-top: 12px; }
.reading .stoprow { display: flex; }
.stoprow .b { flex: 1; }


.view.settings, .view.bible, .view.now { display: none; }
body[data-view] .view.home { display: none; }
body[data-view="settings"] .view.settings, body[data-view="bible"] .view.bible, body[data-view="now"] .view.now { display: block; }
.bar-top { display: flex; align-items: center; justify-content: space-between; }
.bar-top h2 { margin: 0; font-size: 17px; }
.more { margin-top: 14px; }
</style>
</head>
<body>
<div class="titlebar">Reader</div>
<main>

<section class="view home">
  <div class="head">
    <div class="corner"><button class="b" id="open-bible" title="Read the Bible">Bible</button><button class="b cog" id="open-settings" title="Settings" aria-label="Settings">⚙</button></div>
    <div class="icon well"><img id="icon" alt="The Angel with the Golden Hair"></div>
    <div>
      <h1>Reader</h1>
      <div class="date" id="date"></div>
      <div class="feast" id="feast"></div>
      <div class="fast" id="fast"></div>
    </div>
  </div>

  <fieldset class="box status"><legend>Breaks</legend>
    <div class="row"><div class="big" id="next">…</div><label class="onlabel" for="enabled">Breaks on</label><div class="check bevel" id="enabled" role="switch" tabindex="0"></div></div>
    <div class="sub" id="sub"></div>
    <div class="bar well"><i id="bar"></i></div>
    <div class="actions">
      <button class="b default" data-do="break">Break Now</button>
      <button class="b" data-do="listen">Listen</button>
      <button class="b" data-do="today">Today's Readings</button>
    </div>
    <div class="stoprow"><button class="b" id="show-text">Show Text</button><button class="b" data-do="stop">Stop Reading</button></div>
  </fieldset>

  <fieldset class="box ahead"><legend>Ahead</legend>
    <div class="arow" id="ahead-now"></div>
    <div class="arow" id="ahead-feast"></div>
    <div class="arow" id="ahead-season"></div>
  </fieldset>

  <fieldset class="box"><legend>Calendar</legend>
    <div class="calhead">
      <button class="b arrow" id="prev" aria-label="Previous month">◀</button>
      <span id="mname"></span>
      <button class="b arrow" id="nextm" aria-label="Next month">▶</button>
      <button class="b" id="goto-today">Today</button>
    </div>
    <div class="grid well" id="grid"></div>
    <div class="legend"><span><i class="dot strict"></i>Strict fast</span><span><i class="dot relaxed"></i>Fish, wine or oil</span><span>✚ Great feast</span></div>
    <div class="detail well" id="detail"></div>
  </fieldset>

</section>

<section class="view settings">
  <div class="bar-top"><h2>Settings</h2><button class="b default" id="close-settings">Done</button></div>

  <fieldset class="box"><legend>Break</legend>
    <div class="stack"><span class="label">During a break</span>
      <div class="seg" data-key="mode"><button class="b" data-v="lock">Lock Screen</button><button class="b" data-v="listen">Audio Only</button></div></div>
    <div class="stack"><span class="label">The screen shows</span>
      <div class="seg" data-key="screen"><button class="b" data-v="icon">Icon</button><button class="b" data-v="text">Text</button><button class="b" data-v="black">Black</button></div></div>
    <div class="row"><label class="l">Text window in audio mode</label><div class="check bevel" data-key="read_along"></div></div>
    <div class="row"><label class="l">Emergency exit <span class="sub">(hold Ctrl+Alt+Shift+End)</span></label><div class="check bevel" data-key="emergency_exit"></div></div>
  </fieldset>

  <fieldset class="box"><legend>Reading</legend>
    <div class="stack"><div class="seg" data-key="content"><button class="b" data-v="mixed">Mixed</button><button class="b" data-v="saints">Saints</button><button class="b" data-v="scripture">Scripture</button><button class="b" data-v="gospels">Gospels</button><button class="b" data-v="psalter">Psalter</button></div></div>
    <div class="row"><label class="l">Prayers</label><div class="check bevel" data-key="prayers"></div></div>
    <div class="row"><label class="l">The Hour of the day</label><div class="check bevel" data-key="hours"></div></div>
    <div class="row"><label class="l">Morning prayers each new day</label><div class="check bevel" data-key="morning"></div></div>
  </fieldset>

  <fieldset class="box"><legend>Voice</legend>
    <div class="row"><span class="step wide" data-key="voice" data-list="voices"><button class="b">◀</button><output class="well"></output><button class="b">▶</button></span><button class="b" data-do="hear">Hear</button></div>
    <div class="row"><span>Speed</span><span class="step" data-key="rate" data-min="-40" data-max="30" data-by="5" data-fmt="rate"><button class="b">◀</button><output class="well"></output><button class="b">▶</button></span></div>
    <div class="row"><span>Volume</span><span class="step" data-key="voice_volume" data-min="10" data-max="100" data-by="10" data-fmt="pct"><button class="b">◀</button><output class="well"></output><button class="b">▶</button></span></div>
    <div class="row"><label class="l">Birdsong</label><span class="step" data-key="ambience_volume" data-min="0" data-max="100" data-by="10" data-fmt="pct"><button class="b">◀</button><output class="well"></output><button class="b">▶</button></span><div class="check bevel" data-key="ambience"></div></div>
  </fieldset>

  <fieldset class="box"><legend>Time</legend>
    <div class="row"><span>Break every</span><span class="step" data-key="work_minutes" data-min="15" data-max="480" data-by="15" data-fmt="min"><button class="b">◀</button><output class="well"></output><button class="b">▶</button></span></div>
    <div class="row"><span>Break length</span><span class="step" data-key="break_minutes" data-min="1" data-max="60" data-by="1" data-fmt="min"><button class="b">◀</button><output class="well"></output><button class="b">▶</button></span></div>
    <div class="row"><span>New day after <span class="sub">(hours away)</span></span><span class="step" data-key="sleep_hours" data-min="2" data-max="14" data-by="1" data-fmt="h"><button class="b">◀</button><output class="well"></output><button class="b">▶</button></span></div>
    <div class="row"><label class="l">Start with Windows</label><div class="check bevel" data-key="autostart"></div></div>
  </fieldset>

  <fieldset class="box"><legend>Calendar</legend>
    <div class="stack"><span class="label">Week starts on</span>
      <div class="seg" data-key="week_start"><button class="b" data-v="sunday">Sunday</button><button class="b" data-v="monday">Monday</button></div></div>
    <div class="row"><label class="l">Old-style dates in the calendar</label><div class="check bevel" data-key="old_dates"></div></div>
    <div class="row"><label class="l">Note fast days in the morning</label><div class="check bevel" data-key="fast_reminder"></div></div>
  </fieldset>

  <fieldset class="box"><legend>Appearance</legend>
    <div class="seg" data-key="theme"><button class="b" data-v="system">System</button><button class="b" data-v="light">Light</button><button class="b" data-v="dark">Dark</button></div>
  </fieldset>
</section>

<section class="view bible">
  <div class="bar-top"><h2>The Bible</h2><button class="b default" id="close-bible">Done</button></div>
  <fieldset class="box"><legend>Book</legend>
    <div class="row"><select class="b" id="book" aria-label="Book"></select>
      <span class="step" id="chap"><button class="b" aria-label="Previous chapter">◀</button><output class="well"></output><button class="b" aria-label="Next chapter">▶</button></span></div>
    <div class="row"><button class="b default" id="read-aloud">Read Aloud</button><button class="b" data-do="stop">Stop</button></div>
  </fieldset>
  <div class="text well" id="bible-text"></div>
</section>

<section class="view now">
  <div class="bar-top"><h2>Now Reading</h2><button class="b default" id="close-now">Done</button></div>
  <div class="text well" id="now-text"></div>
  <div class="next" id="now-next"></div>
</section>

</main>
<script>
const TOKEN = new URLSearchParams(location.search).get("t");
const $ = (q, el = document) => el.querySelector(q), $$ = (q, el = document) => [...el.querySelectorAll(q)];
let cfg = {}, voices = [], pending = {};
$("#favicon").href = `/favicon.png?t=${TOKEN}`;

const FMT = { pct: v => `${v}%`, min: v => `${v} min`, h: v => `${v} h`, rate: v => v === 0 ? "Normal" : (v > 0 ? `+${v}%` : `${v}%`) };

async function api(path, body) {
  const r = await fetch(path, { method: body ? "POST" : "GET", headers: { "X-Token": TOKEN, "Content-Type": "application/json" },
                                body: body ? JSON.stringify(body) : undefined });
  return r.ok ? r.json() : null;
}
function set(key, value) {
  cfg[key] = value; pending[key] = Date.now(); paint();
  api("/api/set", { key, value });
  if ((key === "week_start" || key === "old_dates") && month) drawMonth();
}

const dark = matchMedia("(prefers-color-scheme: dark)");
function applyTheme() {
  const t = cfg.theme || "system";
  document.documentElement.dataset.theme = t === "system" ? (dark.matches ? "dark" : "light") : t;
}
dark.addEventListener("change", applyTheme);

$$(".seg").forEach(seg => $$("button", seg).forEach(b => b.onclick = () => set(seg.dataset.key, b.dataset.v)));
$$(".check[data-key]").forEach(box => {
  box.setAttribute("role", "checkbox"); box.tabIndex = 0;
  const flip = () => set(box.dataset.key, !cfg[box.dataset.key]);
  box.onclick = flip;
  box.onkeydown = e => (e.key === " " || e.key === "Enter") && (e.preventDefault(), flip());
  const label = $("label", box.closest(".row"));
  if (label) label.onclick = flip;
});
$$(".step[data-key]").forEach(st => {
  const [less, more] = $$("button", st);
  const move = dir => {
    const key = st.dataset.key;
    if (st.dataset.list === "voices") {
      const i = voices.findIndex(v => v[0] === cfg[key]);
      set(key, voices[(i + dir + voices.length) % voices.length][0]);
    } else set(key, Math.min(+st.dataset.max, Math.max(+st.dataset.min, (+cfg[key] || 0) + dir * +st.dataset.by)));
  };
  less.onclick = () => move(-1); more.onclick = () => move(1);
});
$("#enabled").onclick = () => api("/api/do", { action: "toggle" }).then(refresh);
$$("[data-do]").forEach(b => b.onclick = () => api("/api/do", { action: b.dataset.do }).then(() => setTimeout(refresh, 300)));

function paint() {
  applyTheme();
  $$(".seg").forEach(seg => $$("button", seg).forEach(b => b.classList.toggle("on", cfg[seg.dataset.key] === b.dataset.v)));
  $$(".check[data-key]").forEach(box => { box.classList.toggle("on", !!cfg[box.dataset.key]); box.setAttribute("aria-checked", !!cfg[box.dataset.key]); });
  $$(".step[data-key]").forEach(st => {
    const v = cfg[st.dataset.key];
    $("output", st).textContent = st.dataset.list === "voices" ? ((voices.find(x => x[0] === v) || [, v])[1]) : FMT[st.dataset.fmt](v);
  });
}

const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
let view = null, month = null, selected = null, todayIso = null;

function showDetail(item) {
  const box = $("#detail");
  if (!item) { box.innerHTML = ""; return; }
  const saints = (item.saints || []).slice(0, 8).map(s => `<li>${esc(s)}</li>`).join("");
  const refs = (item.readings || []).map(esc).join(" · ");
  box.innerHTML = `<div class="when">${esc(item.iso_label || "")} · ${esc(item.old)}, old style${item.tone ? " · Tone " + item.tone : ""}</div>
    <div class="title">${esc(item.title)}</div>
    <div>${esc(item.fast_text)}</div>
    ${(item.feasts || []).length ? `<div class="refs"><b>Feast:</b> ${item.feasts.map(esc).join("; ")}</div>` : ""}
    ${saints ? `<ul>${saints}</ul>` : ""}
    ${refs ? `<div class="refs"><b>Readings:</b> ${refs}</div>` : ""}
    <button class="b read" id="read-day">Read This Day</button>`;
  $("#read-day").onclick = () => api("/api/do", { action: "day", day: item.iso }).then(() => setTimeout(refresh, 300));
}
function drawMonth() {
  const data = month, grid = $("#grid");
  const sunday = cfg.week_start === "sunday";
  const names = sunday ? ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"] : ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"];
  const offset = sunday ? (data.first + 1) % 7 : data.first;
  $("#mname").textContent = data.name;
  grid.innerHTML = names.map(d => `<div class="wd">${d}</div>`).join("") + "<div></div>".repeat(offset) + data.days.map(d => {
    const cls = ["cell", d.feast, d.iso === todayIso ? "today" : "", d.iso === selected ? "sel" : ""].join(" ");
    const old = cfg.old_dates ? `<small>${esc(String(d.old).split(" ").pop())}</small>` : "";
    return `<div class="${cls}" data-iso="${d.iso}" title="${esc(d.title)}"><b>${d.day}</b>${old}${d.feast === "great" ? '<span class="mk">✚</span>' : ""}${d.fast !== "none" ? `<i class="dot ${d.fast}"></i>` : ""}</div>`;
  }).join("");
  $$(".cell", grid).forEach(c => c.onclick = () => select(c.dataset.iso));
}
function showAhead(a) {
  if (!a) return;
  const count = x => x.days === 0 ? "Today" : x.days === 1 ? "1 day" : `${x.days} days`;
  const date = iso => new Date(iso + "T12:00").toLocaleDateString("en-US", { weekday: "short", month: "short", day: "numeric" });
  const row = (kind, x) => x ? `<span class="kind">${kind}</span><span class="name">${esc(x.name)}<small>${date(x.iso)}</small></span><span class="days well">${count(x)}</span>` : "";
  $("#ahead-now").innerHTML = a.now ? `<span class="kind">Now</span><span class="name">${esc(a.now)}</span><span></span>` : "";
  $("#ahead-feast").innerHTML = row("Great feast", a.feast);
  $("#ahead-season").innerHTML = row("Fast", a.season);
}


async function loadMonth(y, m, pick) {
  const data = await api(`/api/month?y=${y}&m=${m}`);
  if (!data) return;
  month = data; view = { y, m };
  drawMonth();
  showAhead(data.ahead);
  if (pick) select(pick);
}
function select(iso) {
  selected = iso;
  $$(".cell").forEach(c => c.classList.toggle("sel", c.dataset.iso === iso));
  const item = month && month.days.find(d => d.iso === iso);
  if (item) item.iso_label = new Date(iso + "T12:00").toLocaleDateString("en-US", { weekday: "long", month: "long", day: "numeric" });
  showDetail(item);
}
const shift = n => { let { y, m } = view; m += n; if (m < 1) { m = 12; y--; } if (m > 12) { m = 1; y++; } loadMonth(y, m); };
$("#prev").onclick = () => shift(-1);
$("#nextm").onclick = () => shift(1);
$("#goto-today").onclick = () => { const [y, m] = todayIso.split("-").map(Number); loadMonth(y, m, todayIso); };

let iconSet = false;
async function refresh() {
  const s = await api("/api/state");
  if (!s) return;
  voices = s.voices;
  for (const [k, v] of Object.entries(s.cfg)) if (!pending[k] || Date.now() - pending[k] > 1500) cfg[k] = v;
  paint();
  const st = s.status;
  $("#date").textContent = st.date;
  $("#feast").textContent = st.feast;
  $("#fast").textContent = st.today && st.today.fast_text ? st.today.fast_text : "";
  $("#sub").textContent = st.sub;
  $("#next").textContent = st.headline;
  $("#bar").style.width = (st.progress * 100).toFixed(1) + "%";
  $(".bar").style.visibility = st.enabled && !st.reading ? "visible" : "hidden";
  $("#enabled").classList.toggle("on", st.enabled);
  document.body.classList.toggle("reading", st.reading);
  showNow(st.now);
  if (!iconSet) { iconSet = true; $("#icon").src = `/icon?t=${TOKEN}`; }
  if (todayIso !== st.day) {
    todayIso = st.day;
    const want = location.hash.match(/ym=(\d{4})-(\d{2})/);  // e.g. #ym=2027-01 opens that month
    const [y, m] = want ? [+want[1], +want[2]] : st.day.split("-").map(Number);
    loadMonth(y, m, want ? null : st.day);
  }
}
function show(view) {
  if (view) document.body.dataset.view = view; else delete document.body.dataset.view;
  scrollTo(0, 0);
  if (view === "bible" && !books.length) loadBooks();
}
$("#open-settings").onclick = () => show("settings");
$("#close-settings").onclick = () => show(null);
$("#open-bible").onclick = () => show("bible");
$("#close-bible").onclick = () => show(null);
$("#show-text").onclick = () => show("now");
$("#close-now").onclick = () => show(null);
addEventListener("keydown", e => e.key === "Escape" && show(null));

// the Bible: choose a book and chapter, read it yourself, or have it read aloud
let books = [], bookIndex = 0, chapter = 1;
async function loadBooks() {
  const data = await api("/api/bible");
  if (!data) return;
  books = data.books;
  const sel = $("#book");
  let html = "", group = null;
  books.forEach((b, i) => {
    if (b.group !== group) { if (group) html += "</optgroup>"; group = b.group; html += `<optgroup label="${esc(group)}">`; }
    html += `<option value="${i}">${esc(b.name)}</option>`;
  });
  sel.innerHTML = html + "</optgroup>";
  sel.onchange = () => { bookIndex = +sel.value; chapter = 1; loadChapter(); };
  loadChapter();
}
async function loadChapter() {
  const b = books[bookIndex];
  $("#book").value = String(bookIndex);
  $("#chap output").textContent = `${b.name === "Psalms" ? "Psalm" : "Chapter"} ${chapter} of ${b.chapters}`;
  const data = await api(`/api/bible?b=${encodeURIComponent(b.name)}&c=${chapter}`);
  if (!data) return;
  $("#bible-text").innerHTML = `<h3>${esc(data.title)}</h3>` + data.verses.map((v, i) => `<p><sup>${i + 1}</sup>${esc(v)}</p>`).join("");
}
const [chapLess, chapMore] = $$("#chap button");
chapLess.onclick = () => { if (chapter > 1) { chapter--; loadChapter(); } else if (bookIndex > 0) { bookIndex--; chapter = books[bookIndex].chapters; loadChapter(); } };
chapMore.onclick = () => { if (chapter < books[bookIndex].chapters) { chapter++; loadChapter(); } else if (bookIndex < books.length - 1) { bookIndex++; chapter = 1; loadChapter(); } };
$("#read-aloud").onclick = () => api("/api/do", { action: "text", book: books[bookIndex].name, chapter }).then(() => setTimeout(refresh, 300));

// Now Reading: the whole text of what is being read, the sentence being spoken marked
let nowTitle = null;
function showNow(now) {
  if (!now) { $("#now-text").innerHTML = "<p>Nothing is being read.</p>"; $("#now-next").textContent = ""; nowTitle = null; return; }
  if (now.title !== nowTitle) {
    nowTitle = now.title;
    $("#now-text").innerHTML = `<h3>${esc(now.title)}</h3>` + now.lines.map(l => `<p>${esc(l)}</p>`).join("");
  }
  const key = (now.caption || "").slice(0, 40);
  let marked = null;
  $$("#now-text p").forEach(el => { const on = !!key && el.textContent.includes(key); el.classList.toggle("here", on); if (on) marked = el; });
  if (marked && document.body.dataset.view === "now") marked.scrollIntoView({ block: "nearest" });
  $("#now-next").textContent = now.next ? `Next: ${now.next}` : "";
}
if (location.hash === "#settings") show("settings");
if (location.hash === "#bible") show("bible");
refresh();
setInterval(refresh, 1000);
</script>
</body>
</html>
